apiVersion: apps/v1
kind: Deployment
metadata:
  name: staticreg
  labels:
    app: staticreg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staticreg
  template:
    metadata:
      labels:
        app: staticreg
    spec:
      restartPolicy: Always
      containers:
        - name: staticreg
          image: cr.seqera.io/public/staticreg:0.6.0
          command:
            [
              "/staticreg",
              "serve",
              "--cache-duration",
              "1m",
              "--tls-enable",
              "--json-logging",
            ]
          ports:
            - containerPort: 8093
          resources:
            limits:
              memory: "250Mi"
              cpu: "1000m"
          env:
            # Registry Configuration
            - name: STATICREG_REGISTRY_USER
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: STATICREG_REGISTRY_USER
            - name: STATICREG_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: STATICREG_REGISTRY_PASSWORD
            - name: STATICREG_REGISTRY_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: STATICREG_REGISTRY_HOSTNAME

            # Database Configuration (using individual variables)
            # Alternative: use STATICREG_DB_URL for connection string
            - name: STATICREG_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: staticreg-db-credentials
                  key: STATICREG_DB_HOST
            - name: STATICREG_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: staticreg-db-credentials
                  key: STATICREG_DB_PORT
                  optional: true
            - name: STATICREG_DB_USER
              valueFrom:
                secretKeyRef:
                  name: staticreg-db-credentials
                  key: STATICREG_DB_USER
            - name: STATICREG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: staticreg-db-credentials
                  key: STATICREG_DB_PASSWORD
                  optional: true
            - name: STATICREG_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: staticreg-db-credentials
                  key: STATICREG_DB_NAME
            - name: STATICREG_DB_SSLMODE
              valueFrom:
                secretKeyRef:
                  name: staticreg-db-credentials
                  key: STATICREG_DB_SSLMODE
                  optional: true
            - name: STATICREG_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: staticreg-config
                  key: STATICREG_DB_SCHEMA
                  optional: true

            # Webhook Batching Configuration
            - name: STATICREG_METRICS_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: staticreg-config
                  key: STATICREG_METRICS_BATCH_SIZE
                  optional: true
            - name: STATICREG_METRICS_FLUSH_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: staticreg-config
                  key: STATICREG_METRICS_FLUSH_INTERVAL
                  optional: true
            - name: STATICREG_METRICS_BUFFER_SIZE
              valueFrom:
                configMapKeyRef:
                  name: staticreg-config
                  key: STATICREG_METRICS_BUFFER_SIZE
                  optional: true
