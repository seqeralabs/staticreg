<!DOCTYPE html>
<html lang="en">

<head>
    {{template "head" .}}
    <title>Not Found | {{.RegistryName}}</title>
</head>

<body class="bg-gray-100 dark:bg-gray-900">
    <div class="h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-800">
        <div class="max-w-md mx-auto text-center">
            <h1 class="text-4xl font-bold mb-4 text-gray-900 dark:text-white">404 Not Found</h1>
            <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">The page you're looking for doesn't exist.</p>
            <a href="{{.AbsoluteDir}}"
                class="inline-block bg-[#4256e7] hover:bg-black text-white font-bold py-2 px-4 rounded-full">Go
                back home</a>
        </div>
    </div>


    <script src="{{.AbsoluteDir}}static/assets/js/app.js"></script>
</body>

</html>
